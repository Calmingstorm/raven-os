# server-2 (192.168.1.41): /etc/nginx/conf.d/ravenos.conf
# RavenOS in the browser. .13's Apache terminates TLS for ravenos.calmingstorm.net and proxies here;
# nginx only listens on the LAN address, and other names keep getting the default 444.
# Files: /srv/ravenos/current -> /srv/ravenos/releases/<release> (tools/deploy-web.sh).
server {
    listen 192.168.1.41:80;
    server_name ravenos.calmingstorm.net;
    root /srv/ravenos/current;
    index index.html;
    access_log /var/log/nginx/ravenos.access.log;
    error_log /var/log/nginx/ravenos.error.log;
    server_tokens off;

    gzip_static on;
    # Revalidate every file (ETag), so a new release shows up on the next load.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx 1.18's mime.types has no entry for WebAssembly or .mjs, and browsers refuse a
    # module script served as application/octet-stream.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
    }
}
