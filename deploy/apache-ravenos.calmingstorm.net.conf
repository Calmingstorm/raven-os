# .13: /etc/apache2/sites-available/ravenos.calmingstorm.net.conf (added 2026-11-07, Aaron)
# RavenOS in the browser. The site lives on server-2 (192.168.1.41, nginx); .13 has the forwarded
# ports, so it terminates TLS here and proxies. nginx picks the site by the Host header.
<VirtualHost *:80>
    ServerName ravenos.calmingstorm.net

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
        Options None
        AllowOverride None
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/ravenos.calmingstorm.net-error.log
    CustomLog ${APACHE_LOG_DIR}/ravenos.calmingstorm.net-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ravenos.calmingstorm.net

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/ravenos.calmingstorm.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ravenos.calmingstorm.net/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://192.168.1.41/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://192.168.1.41/
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/ravenos.calmingstorm.net-error.log
    CustomLog ${APACHE_LOG_DIR}/ravenos.calmingstorm.net-access.log combined
</VirtualHost>
</IfModule>
