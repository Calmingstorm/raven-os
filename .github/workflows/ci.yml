name: RavenOS CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib binutils grub-pc-bin xorriso mtools qemu-system-x86 python3
      - name: Build and smoke test
        run: ./tools/check.sh
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravenos-iso
          path: build/ravenos.iso
